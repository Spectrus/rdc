    <link rel="stylesheet" href="/cine-regina-mark2/assets/fonts.css"><link rel="stylesheet" href="/cine-regina-mark2/assets/utilities.css"><style>
        .film-grain {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
        }

        .menu-scroll::-webkit-scrollbar {
            width: 6px;
            height: 0px;
        }
        .menu-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .menu-scroll::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 4px;
        }
        .menu-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.8);
        }

        .menu-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .menu-item:hover {
            transform: translateX(10px);
            background: linear-gradient(90deg, rgba(212,175,55,0.1) 0%, rgba(0,0,0,0) 100%);
            border-left: 2px solid #D4AF37;
        }
        
        .menu-item:hover .item-title {
            color: #D4AF37;
        }

        .decorative-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            width: 80%;
            margin: 0 auto;
            opacity: 0.5;
        }

        #cinema-countdown {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #ccb265 0%, #786038 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.6s ease-out;
            animation: subtleGateWeave 0.6s infinite alternate ease-in-out, filmFlicker 0.2s infinite alternate;
        }

        #frame-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            opacity: 0;
            z-index: 9990;
            pointer-events: none;
        }

        .leader-line-v, .leader-line-h {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2;
        }
        .leader-line-v { width: 0.3vmin; height: 100vh; left: 50%; top: 0; transform: translateX(-50%); }
        .leader-line-h { height: 0.3vmin; width: 100vw; top: 50%; left: 0; transform: translateY(-50%); }

        .leader-container {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .leader-ring-outer {
            position: absolute;
            width: 100%; height: 100%;
            border: 0.5vmin solid rgba(0, 0, 0, 0.7);
            border-radius: 50%;
        }

        .leader-ring-inner {
            position: absolute;
            width: 80%; height: 80%;
            border: 0.3vmin solid rgba(0, 0, 0, 0.55);
            border-radius: 50%;
        }

        .leader-sweep-container {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            animation: radarSweep 1s linear infinite;
        }
        .leader-sweep-wedge {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0, 0, 0, 0.45) 0deg, rgba(0, 0, 0, 0.45) 90deg, transparent 90deg, transparent 360deg);
        }

        .countdown-number {
            position: relative;
            z-index: 10;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 50vmin;
            line-height: 1;
            color: #0b0b0b;
            font-weight: bold;
            text-align: center;
            transform: translateY(-2%);
            text-shadow: 0 0 5vmin rgba(0, 0, 0, 0.9);
        }

        .film-scratch {
            position: absolute;
            width: 2px;
            height: 100%;
            background: rgba(204, 178, 101, 0.44);
            z-index: 100;
        }
        .scratch-1 { left: 20%; animation: scratchMove 0.8s infinite linear; }
        .scratch-2 { left: 60%; background: rgba(0, 0, 0, 0.28); animation: scratchMove 1.2s infinite linear 0.5s; }
        .scratch-3 { left: 85%; animation: scratchMove 0.5s infinite linear 0.2s; }

        @keyframes radarSweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes filmFlicker {
            0% { background-color: transparent; }
            50% { background-color: rgba(204, 178, 101, 0.13); }
            100% { background-color: rgba(204, 178, 101, 0.24); }
        }
        @keyframes scratchMove {
            0% { transform: translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(5vw); opacity: 0; }
        }
        @keyframes popFlash {
            0% { opacity: 0.8; }
            20% { opacity: 0; }
            100% { opacity: 0; }
        }
        .flash-active {
            animation: popFlash 1s ease-out;
        }

        .sprocket-track {
            position: absolute;
            top: 0; bottom: 0;
            width: 10vw;
            background-color: rgba(176, 148, 82, 0.84);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='25' y='15' width='50' height='70' rx='8' fill='rgba(0,0,0,0.22)'/%3E%3C/svg%3E");
            background-size: 100% 12vh;
            animation: sprocketRoll 0.5s linear infinite;
            z-index: 20;
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(204, 178, 101, 0.58);
        }
        .sprocket-track.left { left: 0; border-right: 2px solid rgba(0, 0, 0, 0.25); }
        .sprocket-track.right { right: 0; border-left: 2px solid rgba(0, 0, 0, 0.25); }

        @keyframes sprocketRoll {
            from { background-position-y: 0; }
            to { background-position-y: 12vh; }
        }

        .global-flicker {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 49;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.1);
            animation: projectorFlicker 0.15s infinite alternate;
        }
        .global-scratch {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            background: rgba(255, 255, 255, 0.05);
        }
        .subtle-weave {
            animation: subtleGateWeave 0.6s infinite alternate ease-in-out;
        }
        @keyframes projectorFlicker {
            0% { opacity: 0; }
            100% { opacity: 0.4; }
        }
        @keyframes subtleGateWeave {
            0% { transform: translate(0, 0); }
            50% { transform: translate(0.5px, -0.5px); }
            100% { transform: translate(-0.5px, 0.5px); }
        }
    </style>
