<body>
  <iframe id="site" title="Biblioteca Digital" src="index-base-20260905.html"></iframe>
  <script>
  (function(){
    const itens = [
      {
        code:'370', title:'Tiro de Guerra 281 – versão final', author:'Reinaldo Duarte Castanheira', year:'2026', type:'Mídia', button:'Ver',
        link:'https://drive.google.com/file/d/1agPb_hRx7KzrVmTsMSUUJNRf1McM3h7i/view?usp=sharing',
        description:'Documentário de memória afetiva e histórica dedicado aos companheiros do Tiro de Guerra 281 – Classe 1943, que cumpriram o Serviço Militar em Conselheiro Lafaiete no ano de 1962. Preparado décadas depois, o vídeo reúne recordações de um período marcado pela convivência, pela disciplina e pelo aprendizado coletivo, prestando homenagem aos instrutores Sargento Camilo e Sargento Costa e aos jovens que compartilharam quase onze meses de formação. Mais do que recordar fardas, nomes de guerra e fotografias, a obra procura preservar valores que atravessaram aquela experiência: respeito aos mais velhos, hierarquia, cumprimento das normas, amor à Pátria, ética, moralidade e responsabilidade. Ao transformar lembranças pessoais em registro permanente, o documentário devolve voz e presença a uma geração e cria uma ponte entre os antigos integrantes, seus familiares e todos aqueles interessados na história do Tiro de Guerra em Conselheiro Lafaiete.'
      },
      {
        code:'373', title:'Álbum de Fotos de Nosso Casamento', author:'Reinaldo Duarte Castanheira', year:'1967', type:'Mídia', button:'Ver',
        link:'https://drive.google.com/file/d/1-2a6Q05eCexwhknAFTYFN_n2ZPBfJJJL/view?usp=sharing',
        description:'Um álbum audiovisual criado para conservar, em movimento e sequência, as fotografias de um dos acontecimentos mais importantes de uma história familiar: o casamento de Bet e Reinaldo, em 1967. As imagens deixam de ser apenas retratos guardados e passam a compor uma narrativa de memória, capaz de aproximar novamente rostos, gestos, roupas, ambientes e pequenos detalhes de um dia que se tornou ponto de partida para muitas outras histórias. Ao reunir essas fotografias em vídeo, a obra transforma o álbum de família em documento afetivo, preservando não apenas a cerimônia, mas a presença daqueles que fizeram parte daquele momento. É também um convite às gerações seguintes para conhecerem suas origens e perceberem como um instante vivido há décadas continua presente quando é cuidadosamente guardado, revisto e compartilhado.'
      },
      {
        code:'374', title:'59 anos depois', author:'Reinaldo Duarte Castanheira', year:'2026', type:'Mídia', button:'Ver',
        link:'https://drive.google.com/file/d/1ZSy9YtlWMPO0kYAKKjbBOP3FswYRx-tv/view?usp=sharing',
        description:'Cinquenta e nove anos depois do casamento, esta memória audiovisual olha para o tempo não como uma distância que apaga, mas como uma trajetória que acrescenta significado às fotografias, aos encontros e às lembranças de uma vida compartilhada. O que em 1967 era começo, esperança e projeto de futuro pode ser revisto, em 2026, com a perspectiva de quem atravessou décadas de experiências, mudanças, alegrias e desafios. A obra reúne esse sentimento de continuidade: recordar o início para compreender melhor tudo o que veio depois. Mais do que celebrar uma contagem de anos, o vídeo valoriza a permanência dos vínculos, a construção cotidiana de uma família e a capacidade das imagens de devolver ao presente pessoas, lugares e emoções de outros tempos. É um registro de gratidão pela caminhada e, ao mesmo tempo, uma maneira de deixá-la guardada para quem vier depois.'
      },
      {
        code:'375', title:'Frederico no Sítio – 1º Neto', author:'Reinaldo Duarte Castanheira', year:'2026', type:'Mídia', button:'Ver',
        link:'https://drive.google.com/file/d/1xQInECOAbIQx9yWMEi0i_KICdbvgqX7q/view?usp=sharing',
        description:'Registro familiar dedicado a Frederico, o primeiro neto, preservando em vídeo momentos ligados ao sítio e a uma fase da vida que ganha ainda mais valor com a passagem dos anos. Cenas familiares aparentemente simples têm uma força especial quando revisitadas: nelas permanecem a infância, a espontaneidade, o convívio entre gerações e o cenário onde tantas lembranças foram construídas. Ao guardar Frederico no sítio, a Biblioteca conserva mais do que uma gravação doméstica; conserva um fragmento da história da família, visto pelo olhar de quem compreendeu que os pequenos acontecimentos de hoje se transformam nas grandes recordações de amanhã. Esta memória é também uma homenagem ao lugar ocupado pelo primeiro neto na vida dos avós e ao vínculo que se forma quando uma nova geração chega, trazendo consigo novos afetos, novas histórias e a continuidade da família.'
      },
      {
        code:'376', title:'Síntese da Felicidade', author:'Carlos Drummond de Andrade (atribuição do arquivo)', year:'2026', type:'Poema', button:'Ler',
        link:'https://drive.google.com/file/d/1OSDsmMYIrS5tYcVPWIahw5W_-qNeXJRj/view?usp=sharing',
        description:'Um texto poético construído como um inventário das pequenas alegrias que dão sabor à existência. No arquivo preservado, a composição é atribuída a Carlos Drummond de Andrade e reúne imagens de uma felicidade simples, cotidiana e profundamente humana: o cheiro do jardim, o namoro no portão, o encontro com os amigos, um filme antigo, uma palavra amável, a música, o riso de criança, o canto dos pássaros, o pôr do sol na roça, a chuva no telhado, uma velha amizade e a presença de alguém querido. Em vez de procurar a felicidade em acontecimentos grandiosos, o texto a encontra na soma de instantes comuns que, quando vividos com atenção e afeto, passam a ter enorme significado. É uma leitura leve e calorosa sobre amizade, amor, memória, fé, companhia e a arte de reconhecer beleza no que muitas vezes passa despercebido.'
      },
      {
        code:'377', title:'Imortalizando Memórias Centenárias de minha Vó Maria Magdalena', author:'Maria Magdalena Lobo Castanheira / Reinaldo Duarte Castanheira', year:'2024', type:'Livro', button:'Ler',
        link:'https://drive.google.com/file/d/1DujHUHIWimep6EIRjEzrc8cudFOi8niW/view?usp=sharing',
        description:'Uma obra de preservação familiar e histórica dedicada a Maria Magdalena Lobo Castanheira, avó paterna de Reinaldo Duarte Castanheira. Em um caderno manuscrito com admirável cuidado, Maria Magdalena registrou dezenas de crônicas, poemas e contos produzidos desde o final dos anos 1890 até aproximadamente as décadas de 1920 e 1930. A digitalização desse conjunto permite que uma voz nascida no século XIX continue sendo lida no século XXI, conservando não apenas palavras, mas maneiras de pensar, sentir e observar uma realidade hoje distante. Os textos oferecem uma aproximação rara com a vida de uma mulher de outro tempo e ajudam a preservar a memória de uma família que se estabeleceu em Minas Gerais a partir de raízes portuguesas. Ao reunir e disponibilizar esses escritos, a obra cumpre exatamente o propósito da Biblioteca: impedir que lembranças, documentos e experiências desapareçam e permitir que novas gerações encontrem nelas suas próprias origens.'
      }
    ];

    const frame = document.getElementById('site');
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function cardCode(card){
      const el = card && card.querySelector('.document-code');
      return el ? String(el.textContent || '').trim() : '';
    }
    function cardTitle(card){
      const el = card && card.querySelector('h3');
      return el ? String(el.textContent || '').trim() : '';
    }

    function corrigirGalo(doc){
      doc.querySelectorAll('.document-card').forEach(card => {
        if (cardTitle(card) === 'Galo de Briga – versão já OK' && cardCode(card) === '370') {
          const code = card.querySelector('.document-code');
          if (code) code.textContent = '350';
        }
      });
    }

    function criarCard(doc, item){
      const card = doc.createElement('div');
      card.className = 'document-card';
      card.dataset.publicacaoTemporaria = '20260905';

      const code = doc.createElement('div'); code.className = 'document-code'; code.textContent = item.code;
      const h3 = doc.createElement('h3'); h3.textContent = item.title;
      const autor = doc.createElement('div'); autor.className = 'document-author'; autor.textContent = item.author;
      const ano = doc.createElement('div'); ano.className = 'document-year'; ano.textContent = item.year;
      const p = doc.createElement('p'); p.textContent = item.description;
      const footer = doc.createElement('div'); footer.className = 'document-footer';
      const tipo = doc.createElement('span'); tipo.className = 'document-type'; tipo.textContent = item.type;
      const a = doc.createElement('a'); a.className = 'read-button'; a.href = item.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = item.button;
      footer.append(tipo, a);
      card.append(code, h3, autor, ano, p, footer);
      return card;
    }

    function deduplicar(doc){
      corrigirGalo(doc);
      itens.forEach(item => {
        const cards = Array.from(doc.querySelectorAll('.document-card')).filter(c => cardCode(c) === item.code);
        if (cards.length <= 1) return;
        let keeper = cards.find(c => !c.dataset.publicacaoTemporaria && cardTitle(c) === item.title)
                  || cards.find(c => cardTitle(c) === item.title)
                  || cards[0];
        cards.forEach(c => { if (c !== keeper) c.remove(); });
      });
    }

    function injetar(doc){
      corrigirGalo(doc);
      const grid = doc.getElementById('visible-documents');
      if (!grid) return false;
      itens.forEach(item => {
        const exact = Array.from(doc.querySelectorAll('.document-card')).some(c => cardCode(c) === item.code && cardTitle(c) === item.title);
        if (!exact) grid.prepend(criarCard(doc, item));
      });
      deduplicar(doc);
      return true;
    }

    async function sincronizarFirebase(win){
      for (let i=0; i<80; i++) {
        if (typeof win.firebaseLoadMemories === 'function' && typeof win.firebaseSaveMemory === 'function' && typeof win.firebaseUpdateByCode === 'function') break;
        await sleep(250);
      }
      if (typeof win.firebaseLoadMemories !== 'function' || typeof win.firebaseSaveMemory !== 'function') return;
      try { if (win.waitForFirebaseAuth) await win.waitForFirebaseAuth; } catch (_) {}
      let existentes = [];
      try { existentes = await win.firebaseLoadMemories(); } catch (_) { existentes = []; }
      const porCodigo = new Map(existentes.map(x => [String(x.code || ''), x]));
      for (const item of itens) {
        const fields = { title:item.title, author:item.author, year:item.year, type:item.type, description:item.description, sinopse:item.description, link:item.link };
        try {
          if (porCodigo.has(item.code)) {
            await win.firebaseUpdateByCode(Number(item.code), fields);
          } else {
            await win.firebaseSaveMemory({ ...fields, code:Number(item.code), avisarLista:false });
            porCodigo.set(item.code, true);
          }
        } catch (err) {
          console.error('[publicacoes 2026-09-05] falha no código', item.code, err);
        }
      }
    }

    // Keep cards as direct grid children so the existing filters and sorting still work.
    function instalarSinopses(doc, win){
      const acervo = doc.getElementById('acervo');
      if (!acervo) return;
      const style = doc.createElement('style');
      style.textContent = `
        #acervo:not(.view-list) .rdc-masonry { position:relative; }
        #acervo:not(.view-list) .rdc-masonry > .document-card {
          position:absolute; box-sizing:border-box; height:auto; min-height:0;
        }
        #acervo:not(.view-list) .rdc-synopsis {
          flex:none; box-sizing:content-box; min-height:0; overflow:hidden;
          transition:height 400ms cubic-bezier(.22,1,.36,1);
        }
        #acervo:not(.view-list) .rdc-synopsis.rdc-clamped {
          display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3;
        }
        #acervo .rdc-synopsis-toggle {
          align-self:flex-start; border:0; background:transparent;
          color:var(--primary-color, #4a2c2a); font:inherit; font-weight:600;
          text-decoration:underline; text-underline-offset:3px; cursor:pointer;
          padding:4px 0; margin:0 0 1rem; border-radius:4px;
        }
        #acervo .rdc-synopsis-toggle:focus-visible { outline:2px solid currentColor; outline-offset:4px; }
        #acervo .rdc-synopsis-toggle[hidden], #acervo.view-list .rdc-synopsis-toggle { display:none; }
        #acervo.view-list .rdc-synopsis { height:auto !important; }
        @media (prefers-reduced-motion:reduce) {
          #acervo .rdc-synopsis { transition:none !important; }
        }
      `;
      doc.head.appendChild(style);
      const states = new Map();
      const entries = new WeakMap();
      let serial = 0, pending = 0;
      const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };
      const schedule = () => { if (!pending) pending = win.requestAnimationFrame(layout); };
      const resize = new win.ResizeObserver(schedule);
      const mutations = new win.MutationObserver(schedule);
      const observe = () => mutations.observe(acervo, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['class','style']});

      function prepare(card){
        const p = card.querySelector(':scope > p, :scope > .video-synopsis');
        if (!p) return null;
        let entry = entries.get(p);
        if (entry) return entry;
        const key = card.dataset.cloudId || (cardCode(card) + ':' + cardTitle(card));
        const button = doc.createElement('button');
        button.type = 'button'; button.className = 'rdc-synopsis-toggle';
        if (!p.id) p.id = 'rdc-synopsis-' + (++serial);
        button.setAttribute('aria-controls', p.id);
        p.classList.add('rdc-synopsis');
        p.after(button);
        entry = {p, button, key, expanded:states.get(key) || false, width:0, text:null, full:0, preview:0};
        entries.set(p, entry);
        const settle = () => p.classList.toggle('rdc-clamped', !entry.expanded);
        p.addEventListener('transitionend', e => { if (e.propertyName === 'height') settle(); });
        button.addEventListener('click', e => {
          e.stopPropagation();
          entry.expanded = !entry.expanded;
          states.set(key, entry.expanded);
          p.classList.remove('rdc-clamped');
          set(p, 'height', (entry.expanded ? entry.full : entry.preview) + 'px');
          button.textContent = entry.expanded ? 'Ler menos' : 'Ler mais';
          button.setAttribute('aria-expanded', String(entry.expanded));
          if (win.matchMedia('(prefers-reduced-motion: reduce)').matches) settle();
          schedule();
        });
        resize.observe(card);
        return entry;
      }

      function layout(){
        pending = 0;
        mutations.disconnect();
        const list = acervo.classList.contains('view-list');
        acervo.querySelectorAll('.documents-grid').forEach(grid => {
          resize.observe(grid);
          const cards = Array.from(grid.children).filter(c => c.classList.contains('document-card'));
          if (list) {
            grid.classList.remove('rdc-masonry'); set(grid, 'height', '');
            cards.forEach(card => {
              ['width','top','left'].forEach(prop => set(card, prop, ''));
              const p = card.querySelector('.rdc-synopsis');
              if (p) { set(p, 'height', ''); p.classList.remove('rdc-clamped'); const entry = entries.get(p); if (entry) entry.width = 0; }
            });
            return;
          }
          if (!grid.clientWidth || win.getComputedStyle(grid).display === 'none') return;
          const css = win.getComputedStyle(grid);
          const columns = Math.max(1, css.gridTemplateColumns.split(' ').filter(Boolean).length);
          const gap = parseFloat(css.columnGap) || 0;
          const rowGap = parseFloat(css.rowGap) || gap;
          const width = (grid.clientWidth - gap * (columns - 1)) / columns;
          const heights = Array(columns).fill(0);
          grid.classList.add('rdc-masonry');
          let index = 0;
          cards.forEach(card => {
            if (win.getComputedStyle(card).display === 'none') return;
            const column = index++ % columns;
            set(card, 'width', width + 'px');
            const entry = prepare(card);
            if (entry) {
              const {p, button} = entry;
              if (entry.width !== width || entry.text !== p.textContent) {
                entry.width = width; entry.text = p.textContent;
                set(p, 'transition', 'none'); p.classList.remove('rdc-clamped'); set(p, 'height', 'auto');
                const pc = win.getComputedStyle(p);
                const line = parseFloat(pc.lineHeight) || parseFloat(pc.fontSize) * 1.2;
                entry.full = p.getBoundingClientRect().height - (parseFloat(pc.paddingTop) || 0) - (parseFloat(pc.paddingBottom) || 0);
                entry.preview = Math.min(entry.full, line * 3);
                button.hidden = entry.full <= line * 3 + 1;
                set(p, 'height', (entry.expanded ? entry.full : entry.preview) + 'px');
                p.classList.toggle('rdc-clamped', !entry.expanded);
                void p.offsetHeight;
                set(p, 'transition', '');
                button.textContent = entry.expanded ? 'Ler menos' : 'Ler mais';
                button.setAttribute('aria-expanded', String(entry.expanded));
              }
            }
            set(card, 'left', (column * (width + gap)) + 'px');
            set(card, 'top', heights[column] + 'px');
            heights[column] += card.offsetHeight + rowGap;
          });
          set(grid, 'height', Math.max(0, ...heights.map(h => h - rowGap)) + 'px');
        });
        observe();
      }
      observe();
      win.addEventListener('resize', schedule);
      doc.fonts.ready.then(() => {
        acervo.querySelectorAll('.rdc-synopsis').forEach(p => { const entry = entries.get(p); if (entry) entry.width = 0; });
        schedule();
      });
      schedule();
    }

    frame.addEventListener('load', async function(){
      let doc, win;
      try { doc = frame.contentDocument; win = frame.contentWindow; } catch (_) { return; }
      if (!doc || !win) return;
      document.title = doc.title || document.title;
      for (let i=0; i<40 && !injetar(doc); i++) await sleep(150);
      instalarSinopses(doc, win);
      const obs = new MutationObserver(() => deduplicar(doc));
      try { obs.observe(doc.documentElement, {childList:true, subtree:true}); } catch (_) {}
      sincronizarFirebase(win).then(() => {
        setTimeout(() => { try { deduplicar(doc); } catch (_) {} }, 1200);
      });
    });
  })();
  </script>
