    function cardCode(card){
      const el = card && card.querySelector('.document-code');
      return el ? String(el.textContent || '').trim() : '';
    }
    function cardTitle(card){
      const el = card && card.querySelector('h3');
      return el ? String(el.textContent || '').trim() : '';
    }

    function corrigirGalo(doc){
      doc.querySelectorAll('.document-author,.timeline-author-horizontal').forEach(author=>{
        if (/^rdc$/i.test(author.textContent.trim())) author.textContent='Reinaldo Duarte Castanheira';

      doc.querySelectorAll('.document-card').forEach(card => {
        const link = card.querySelector('a[href]')?.getAttribute('href') || '';

    function criarCard(doc, item){
      const card = doc.createElement('div');
      card.className = 'document-card';
      card.dataset.publicacaoTemporaria = '20260905';

      const code = doc.createElement('div'); code.className = 'document-code'; code.textContent = item.code;
      const h3 = doc.createElement('h3'); h3.textContent = item.title;
      const autor = doc.createElement('div'); autor.className = 'document-author'; autor.textContent = item.author;
      const ano = doc.createElement('div'); ano.className = 'document-year'; ano.textContent = item.year;
      const p = doc.createElement('p'); p.textContent = item.description;
      const footer = doc.createElement('div'); footer.className = 'document-footer';
      const tipo = doc.createElement('span'); tipo.className = 'document-type'; tipo.textContent = item.type;
      const a = doc.createElement('a'); a.className = 'read-button'; a.href = item.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = item.button;
      footer.append(tipo, a);
      card.append(code, h3, autor, ano, p, footer);
      return card;
    }

    function deduplicar(doc){
      corrigirGalo(doc);
      itens.forEach(item => {
        const cards = Array.from(doc.querySelectorAll('.document-card')).filter(c => cardCode(c) === item.code);
        if (cards.length <= 1) return;
        let keeper = cards.find(c => !c.dataset.publicacaoTemporaria && cardTitle(c) === item.title)
                  || cards.find(c => cardTitle(c) === item.title)
                  || cards[0];
        cards.forEach(c => { if (c !== keeper) c.remove(); });
      });
    }

    function injetar(doc){
      corrigirGalo(doc);
      const grid = doc.getElementById('visible-documents');
      if (!grid) return false;
      itens.forEach(item => {
        const exact = Array.from(doc.querySelectorAll('.document-card')).some(c => cardCode(c) === item.code && cardTitle(c) === item.title);
        if (!exact) grid.prepend(criarCard(doc, item));
      });
      deduplicar(doc);
      return true;
    }

    async function sincronizarFirebase(win){
      for (let i=0; i<80; i++) {
        if (typeof win.firebaseLoadMemories === 'function' && typeof win.firebaseSaveMemory === 'function' && typeof win.firebaseUpdateByCode === 'function') break;
        await sleep(250);
      }
      if (typeof win.firebaseLoadMemories !== 'function' || typeof win.firebaseSaveMemory !== 'function') return;
      try { if (win.waitForFirebaseAuth) await win.waitForFirebaseAuth; } catch (_) {}
      let existentes = [];
      try { existentes = await win.firebaseLoadMemories(); } catch (_) { existentes = []; }
      const porCodigo = new Map(existentes.map(x => [String(x.code || ''), x]));
      for (const item of itens) {
        const fields = { title:item.title, author:item.author, year:item.year, type:item.type, description:item.description, sinopse:item.description, link:item.link };
        try {
          if (porCodigo.has(item.code)) {
            await win.firebaseUpdateByCode(Number(item.code), fields);
          } else {
            await win.firebaseSaveMemory({ ...fields, code:Number(item.code), avisarLista:false });
            porCodigo.set(item.code, true);
          }
        } catch (err) {
          console.error('[publicacoes 2026-09-05] falha no código', item.code, err);
        }
      }
    }

    // Explicit target heights keep animation independent of resize notifications.
    function instalarSinopses(doc, win){
      const acervo = doc.getElementById('acervo');
      if (!acervo) return;
      const style = doc.createElement('style');
      style.textContent = `
        #acervo:not(.view-list) .rdc-masonry {
          position:relative; overflow-anchor:none;
          transition:height 400ms cubic-bezier(.22,1,.36,1);

        }
        #acervo:not(.view-list) .rdc-masonry > .document-card:not([data-rdc-ready]) { visibility:hidden; }
        #acervo:not(.view-list) .rdc-synopsis {

        #acervo:not(.view-list) .rdc-masonry > .document-card .rdc-synopsis { margin:0 0 8px; }
        /* Preserve full-size media previews; the shared collapsed height includes them. */

          flex-shrink:0;
        }
        #acervo .rdc-synopsis-toggle {
          align-self:flex-start; flex:0 0 auto; border:0; background:transparent;
          color:var(--primary-color, #4a2c2a); font:inherit; font-weight:600;
          text-decoration:underline; text-underline-offset:3px; cursor:pointer;
          padding:4px 0; margin:0 0 1rem; border-radius:4px;
        }
        #acervo .rdc-synopsis-toggle:focus-visible { outline:2px solid currentColor; outline-offset:4px; }
        #acervo .rdc-synopsis-toggle[data-unneeded] { visibility:hidden; pointer-events:none; }
        #acervo.view-list .rdc-synopsis-toggle { display:none; }
        #acervo.view-list .rdc-synopsis { height:auto !important; }
        #acervo .rdc-measuring, #acervo .rdc-measuring > .document-card,
        #acervo .rdc-measuring .rdc-synopsis { transition:none !important; }
        @media (prefers-reduced-motion:reduce) {
          #acervo .rdc-masonry, #acervo .rdc-masonry > .document-card,
          #acervo .rdc-synopsis { transition:none !important; }
        }
      `;
      doc.head.appendChild(style);
      const expanded = new Map();
      const entries = new WeakMap();
      const grids = new Map();
      let serial = 0, pending = 0;
      const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };
      const mutations = new win.MutationObserver(() => schedule());
      const observe = () => mutations.observe(acervo, {
        childList:true, subtree:true, characterData:true,
        attributes:true, attributeFilter:['class','style']
      });
      function schedule(){
        if (!pending) pending = win.requestAnimationFrame(rebuild);
      }
      // Only container WIDTH changes invalidate measurements. Animated heights do not.
      const resize = new win.ResizeObserver(records => {
        if (records.some(r => {
          const state = grids.get(r.target);
          return state && Math.abs(r.contentRect.width - state.width) > 0.5;
        })) schedule();
      });
      function keyFor(card){
        return card.dataset.cloudId || (cardCode(card) + ':' + cardTitle(card));
      }
      function prepare(card){
        const p = card.querySelector(':scope > p, :scope > .video-synopsis');
        if (!p) return null;
        let entry = entries.get(p);
        if (entry) return entry;
        const button = doc.createElement('button');
        button.type = 'button'; button.className = 'rdc-synopsis-toggle';
        if (!p.id) p.id = 'rdc-synopsis-' + (++serial);
        button.setAttribute('aria-controls', p.id);
        p.classList.add('rdc-synopsis'); p.after(button);
        entry = {p, button, key:keyFor(card), full:0, preview:0};
        entries.set(p, entry);
        button.addEventListener('click', event => {
          event.stopPropagation();
          if (button.hasAttribute('data-unneeded')) return;
          if (pending) { win.cancelAnimationFrame(pending); rebuild(); }
          expanded.set(entry.key, !expanded.get(entry.key));
          mutations.disconnect();
          const state = grids.get(card.parentElement);
          if (state) place(state);
          observe();
        });
        return entry;
      }
      function place(state){
        const heights = Array(state.columns).fill(0);
        state.cards.forEach((card, index) => {
          const entry = entries.get(card.querySelector('.rdc-synopsis'));
          const open = entry && expanded.get(entry.key);
          const spare = Math.max(0, state.baseHeight - state.collapsedHeights.get(card));
          const extra = open ? Math.max(0, entry.full - entry.preview - spare) : 0;
          const height = state.baseHeight + extra;
          const column = index % state.columns;
          if (entry) {
            set(entry.p, 'height', (open ? Math.max(entry.full, entry.preview) : entry.preview) + 'px');
            const label = open ? 'Ler menos' : 'Ler mais';
            if (entry.button.textContent !== label) entry.button.textContent = label;
            entry.button.setAttribute('aria-expanded', String(!!open));
          }
          set(card, 'height', height + 'px');
          set(card, 'left', (column * (state.cardWidth + state.gap)) + 'px');
          set(card, 'top', heights[column] + 'px');
          card.setAttribute('data-rdc-ready', 'true');
          heights[column] += height + state.rowGap;
        });
        set(state.grid, 'height', Math.max(0, ...heights.map(h => h - state.rowGap)) + 'px');
      }
      function rebuild(){
        pending = 0;
        mutations.disconnect();
        const list = acervo.classList.contains('view-list');
        for (const [grid] of grids) {
          if (!grid.isConnected) { resize.unobserve(grid); grids.delete(grid); }
        }
        acervo.querySelectorAll('.documents-grid').forEach(grid => {
          const all = Array.from(grid.children).filter(c => c.classList.contains('document-card'));
          if (list) {
            grid.classList.remove('rdc-masonry');
            set(grid, 'height', '');
            all.forEach(card => {
              ['height','width','top','left'].forEach(prop => set(card, prop, ''));
              const p = card.querySelector('.rdc-synopsis');
              if (p) set(p, 'height', '');
            });
            return;
          }
          if (!grid.clientWidth || win.getComputedStyle(grid).display === 'none') return;
          const css = win.getComputedStyle(grid);
          const columns = Math.max(1, css.gridTemplateColumns.split(' ').filter(Boolean).length);
          const gap = parseFloat(css.columnGap) || 0;
          const rowGap = parseFloat(css.rowGap) || gap;
          const width = grid.clientWidth;
          const cardWidth = (width - gap * (columns - 1)) / columns;
          const cards = all.filter(card => win.getComputedStyle(card).display !== 'none');
          const state = {grid, cards, width, columns, gap, rowGap, cardWidth, baseHeight:0, collapsedHeights:new Map()};
          if (!grids.has(grid)) resize.observe(grid);
          grids.set(grid, state);
          grid.classList.add('rdc-masonry', 'rdc-measuring');
          // Write sizes together, then read all geometry before the next write.
          const measured = cards.map(card => {
            set(card, 'width', cardWidth + 'px'); set(card, 'height', 'auto');
            const entry = prepare(card);
            if (entry) set(entry.p, 'height', 'auto');
            return entry;
          }).filter(Boolean);
          measured.forEach(({p}) => {
            if (win.getComputedStyle(p).lineHeight === 'normal') set(p, 'lineHeight', '1.5');
          });
          measured.forEach(entry => {
            const pc = win.getComputedStyle(entry.p);
            const line = parseFloat(pc.lineHeight) || (parseFloat(pc.fontSize) || 16) * 1.5;
            const padding = (parseFloat(pc.paddingTop) || 0) + (parseFloat(pc.paddingBottom) || 0);
            const border = (parseFloat(pc.borderTopWidth) || 0) + (parseFloat(pc.borderBottomWidth) || 0);
            entry.full = Math.ceil(entry.p.getBoundingClientRect().height - padding - border);
            entry.preview = line * 3;
          });
          measured.forEach(entry => {
            const {p, button} = entry;
            button.toggleAttribute('data-unneeded', entry.full <= entry.preview + 1);
            button.tabIndex = button.hasAttribute('data-unneeded') ? -1 : 0;
            const label = expanded.get(entry.key) ? 'Ler menos' : 'Ler mais';
            if (button.textContent !== label) button.textContent = label;
            set(p, 'height', entry.preview + 'px');
          });
          cards.forEach(card => {
            const naturalHeight = Math.ceil(card.getBoundingClientRect().height);
            state.collapsedHeights.set(card, naturalHeight);
            state.baseHeight = Math.max(state.baseHeight, naturalHeight);
          });
          place(state);
          void grid.offsetHeight;
          grid.classList.remove('rdc-measuring');
        });
        observe();
      }
      win.addEventListener('resize', schedule);
      acervo.addEventListener('load', event => { if (event.target.tagName === 'IMG') schedule(); }, true);
      doc.fonts.ready.then(schedule);
      rebuild();
    }

      doc.head.append(css);
      const host=doc.createElement('aside');host.id='rdc-librarian';host.hidden=true;host.setAttribute('aria-label','Bibliotecário');
      host.innerHTML='<iframe title="Bibliotecário reativo" allow="microphone; autoplay" src="about:blank"></iframe><button id="rdc-librarian-close" type="button" aria-label="Voltar o Bibliotecário ao canto">← Voltar</button>';
      doc.body.append(host);
      const visual=host.querySelector('iframe'), exit=host.querySelector('button');
      let visible=false, fullscreen=false, loaded=false;
      let miniPosition = null;
      function moveMini(x,y){
        const r=visual.getBoundingClientRect();
        miniPosition={x:Math.max(0,Math.min(x,win.innerWidth-r.width)),y:Math.max(0,Math.min(y,win.innerHeight-r.height))};
        host.style.setProperty('--mini-x',miniPosition.x+'px');
        host.style.setProperty('--mini-y',miniPosition.y+'px');
      }
      win.addEventListener('resize',()=>{if(!fullscreen&&miniPosition)moveMini(miniPosition.x,miniPosition.y);});
      const links=()=>Array.from(doc.querySelectorAll('.nav-bar a,.mobile-nav a')).filter(a=>/bibliotecario/.test(a.getAttribute('href')||''));
      const speak=on=>{if(loaded)visual.contentWindow?.postMessage({type:'viz-dock',action:'hover-audio',on:!!on},win.location.origin);};
      function sync(){
        links().forEach(a=>{
          a.dataset.rdcLibrarian='';
          a.textContent=visible?'Dispensar Bibliotecário':'Falar com o Bibliotecário';
          a.setAttribute('aria-controls',host.id);
          a.setAttribute('aria-expanded',String(visible));
        });
      }
      function showFull(){
        visible=true;fullscreen=true;host.hidden=false;host.classList.remove('is-corner');
        if(visual.src==='about:blank')visual.src='bibliotecario.html?embed=dock&v=full-reactive';
        else if(loaded)visual.contentWindow?.postMessage({type:'viz-dock',action:'set-fs',fs:true},win.location.origin);
        sync();
      }
      function collapse(){
        if(!visible)return;
        speak(false);fullscreen=false;host.classList.add('is-corner');
        if(loaded)visual.contentWindow?.postMessage({type:'viz-dock',action:'set-fs',fs:false},win.location.origin);
      }
      function dismiss(){
        speak(false);visible=false;fullscreen=false;host.hidden=true;host.classList.remove('is-corner');visual.src='about:blank';loaded=false;sync();
      }
      visual.addEventListener('load',()=>{
        loaded=true;
        const child=visual.contentDocument;
        if(child){
          const style=child.createElement('style');
          style.textContent='html,body{background:transparent!important}body.embed-dock:not(.embed-fs) .stage{background:transparent!important;border-color:transparent!important;box-shadow:none!important;backdrop-filter:none!important}.dock-tools,.dock-nav,.dock-chrome,.dock-exit-btn,#rdc-audio-controls{display:none!important}';
          child.head.append(style);
          let drag=null, moved=false;
          child.addEventListener('pointerdown',event=>{
            if(fullscreen || event.button!==0) return;
            const r=visual.getBoundingClientRect();
            drag={id:event.pointerId,x:event.screenX,y:event.screenY,left:r.left,top:r.top};
            moved=false;
            child.documentElement.setPointerCapture(event.pointerId);
            event.preventDefault();event.stopImmediatePropagation();
            speak(false);
          },true);
          child.addEventListener('pointermove',event=>{
            if(!drag||event.pointerId!==drag.id) return;
            const dx=event.screenX-drag.x,dy=event.screenY-drag.y;
            if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
            if(moved){
              visual.style.transition='none';
              moveMini(drag.left+dx,drag.top+dy);
            }
            event.stopImmediatePropagation();
          },true);
          const endDrag=event=>{
            if(!drag) return;
            const id=drag.id;drag=null;
            if(child.documentElement.hasPointerCapture(id))child.documentElement.releasePointerCapture(id);
            visual.style.transition='';
            event.stopImmediatePropagation();
          };
          child.addEventListener('pointerup',endDrag,true);
          child.addEventListener('pointercancel',endDrag,true);
          child.addEventListener('click',event=>{
            if(fullscreen)return;
            event.preventDefault();event.stopImmediatePropagation();
            if(!moved)showFull();
            moved=false;
          },true);
        }
        visual.contentWindow?.postMessage({type:'viz-dock',action:'set-fs',fs:fullscreen},win.location.origin);
      });
      visual.addEventListener('pointerenter',()=>speak(true));
      visual.addEventListener('pointerleave',()=>speak(false));
      exit.addEventListener('click',collapse);
      doc.addEventListener('click',event=>{
        const link=event.target.closest('a');
        if(!link||!links().includes(link))return;
        event.preventDefault();event.stopImmediatePropagation();
        if(!visible)showFull();else dismiss();
      },true);
      doc.addEventListener('keydown',event=>{if(event.key==='Escape'&&visible){if(fullscreen)collapse();else dismiss();}});
      sync();
    }

    function instalarPlayerBiblioteca(doc, win){
      if (doc.getElementById('rdc-video-dialog')) return;
      const style = doc.createElement('style');
      style.textContent = `
        #rdc-video-dialog{position:fixed;inset:auto;margin:0;box-sizing:border-box;max-width:none;max-height:none;padding:0;border:1px solid #d3b35d;border-radius:12px;background:#f7f0e4;color:#4a2c2a;box-shadow:0 24px 90px #0008;overflow:hidden}
        #rdc-video-dialog::backdrop{background:rgba(32,23,20,.78);backdrop-filter:blur(5px)}
        #rdc-video-dialog[open]{display:flex;flex-direction:column;animation:rdc-player-enter .24s ease-out}
        #rdc-video-dialog header{position:static;display:flex;flex:none;align-items:center;gap:8px;padding:10px 12px;cursor:grab;touch-action:none;user-select:none;background:#f7f0e4}
        #rdc-video-dialog header:active{cursor:grabbing}
        #rdc-video-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;font:600 clamp(16px,2vw,22px)/1.3 Georgia,serif}
        #rdc-video-dialog header button{flex:none;width:44px;height:44px;border:1px solid #b4964c;border-radius:50%;background:transparent;color:#4a2c2a;font:30px/1 Georgia,serif;cursor:pointer}
        #rdc-video-dialog header button:hover{background:#e9d7a3}
        #rdc-video-dialog :focus-visible{outline:3px solid #8a651b;outline-offset:3px}
        #rdc-video-stage{position:relative;flex:1;min-height:0;background:#161311}
        #rdc-video-stage iframe{display:block;position:absolute;inset:0;width:100%;height:100%;border:0}
        #rdc-video-resize{position:absolute;bottom:0;right:0;width:26px;height:26px;z-index:2;border:0;border-radius:8px 0 0 0;background:#f7f0e4;color:#795a21;cursor:nwse-resize;touch-action:none;font:20px/1 sans-serif}
        #rdc-video-dialog.is-adjusting iframe{pointer-events:none}
        @media(max-width:480px){#rdc-video-dialog header{gap:4px;padding:8px}#rdc-video-dialog header button{width:34px;height:36px;font-size:23px}}
        @keyframes rdc-player-enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
        @media(prefers-reduced-motion:reduce){#rdc-video-dialog[open]{animation:none}}
      `;
      doc.head.append(style);
      const dialog = doc.createElement('dialog');
      dialog.id = 'rdc-video-dialog';
      dialog.setAttribute('aria-labelledby','rdc-video-title');
      dialog.innerHTML = '<header><h2 id="rdc-video-title"></h2><button type="button" data-size="smaller" aria-label="Reduzir janela" title="Reduzir janela">−</button><button type="button" data-size="larger" aria-label="Aumentar janela" title="Aumentar janela">+</button><button type="button" data-size="reset" aria-label="Centralizar e restaurar tamanho" title="Centralizar e restaurar tamanho">↺</button><button id="rdc-video-close" type="button" aria-label="Fechar vídeo" autofocus>×</button></header><div id="rdc-video-stage"></div><button id="rdc-video-resize" type="button" aria-label="Ajustar tamanho da janela pelas setas do teclado ou arrastando" title="Arraste para ajustar o tamanho">◢</button>';
      doc.body.append(dialog);
      const stage = dialog.querySelector('#rdc-video-stage');
      const title = dialog.querySelector('h2');
      const grip = dialog.querySelector('#rdc-video-resize');
      const clamp = (n,min,max) => Math.max(min,Math.min(n,max));
      let box = {x:0,y:0,w:0,h:0}, gesture = null;
      function position(x,y,w,h){
        const vw = win.innerWidth, vh = win.innerHeight;
        box.w = clamp(w,Math.min(320,vw-16),vw-16);
        box.h = clamp(h,Math.min(220,vh-16),vh-16);
        box.x = clamp(x,8,Math.max(8,vw-box.w-8));
        box.y = clamp(y,8,Math.max(8,vh-box.h-8));
        Object.assign(dialog.style,{left:box.x+'px',top:box.y+'px',width:box.w+'px',height:box.h+'px'});
      }
      function resetSize(){
        const w = Math.min(1000,win.innerWidth-32,(win.innerHeight-96)*16/9);
        const h = w*9/16+66;
        position((win.innerWidth-w)/2,(win.innerHeight-h)/2,w,h);
      }
      function scaleSize(factor){
        const w = box.w*factor, h = box.h*factor;
        position(box.x+(box.w-w)/2,box.y+(box.h-h)/2,w,h);
      }
      dialog.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
        if(button.dataset.size === 'reset') resetSize();
        else scaleSize(button.dataset.size === 'smaller' ? .85 : 1.15);
      }));
      function finishGesture(){
        if(!gesture) return;
        const {target,id} = gesture;
        gesture = null;
        dialog.classList.remove('is-adjusting');
        if(target.hasPointerCapture(id)) target.releasePointerCapture(id);
      }
      function beginGesture(event,resize){
        if(event.button !== 0 || (!resize && event.target.closest('button'))) return;
        event.preventDefault();
        gesture = {target:event.currentTarget,id:event.pointerId,x:event.clientX,y:event.clientY,box:{...box},resize};
        gesture.target.setPointerCapture(event.pointerId);
        dialog.classList.add('is-adjusting');
      }
      dialog.querySelector('header').addEventListener('pointerdown',e=>beginGesture(e,false));
      grip.addEventListener('pointerdown',e=>beginGesture(e,true));
      dialog.addEventListener('pointermove',event=>{
        if(!gesture || event.pointerId !== gesture.id) return;
        const dx = event.clientX-gesture.x, dy = event.clientY-gesture.y, b = gesture.box;
        if(gesture.resize) position(b.x,b.y,Math.min(b.w+dx,win.innerWidth-b.x-8),Math.min(b.h+dy,win.innerHeight-b.y-8));
        else position(b.x+dx,b.y+dy,b.w,b.h);
      });
      ['pointerup','pointercancel','lostpointercapture'].forEach(name=>dialog.addEventListener(name,finishGesture));
      grip.addEventListener('keydown',event=>{
        const steps = {ArrowLeft:[-24,0],ArrowRight:[24,0],ArrowUp:[0,-24],ArrowDown:[0,24]};
        const step = steps[event.key];
        if(!step) return;
        event.preventDefault();
        position(box.x,box.y,box.w+step[0],box.h+step[1]);
      });
      win.addEventListener('resize',()=>{if(dialog.open) position(box.x,box.y,box.w,box.h);});
      let trigger, oldOverflow;
      dialog.addEventListener('close',()=>{
        finishGesture();
        stage.replaceChildren(); // Destroy the player so audio stops immediately.
        doc.documentElement.style.overflow = oldOverflow;
        if (trigger?.isConnected) trigger.focus({preventScroll:true});
      });
      dialog.querySelector('#rdc-video-close').addEventListener('click',()=>dialog.close());
      dialog.addEventListener('click',event=>{
        if(event.target !== dialog) return;
        const r = dialog.getBoundingClientRect();
        if(event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) dialog.close();
      });
      doc.addEventListener('click',event=>{
        if(event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        const link = event.target.closest('a[href]');
        if(!link || dialog.contains(link)) return;
        const card = link.closest('.document-card');
        const type = card?.querySelector('.document-type')?.textContent.trim() || '';
        const isVideo = card && (card.classList.contains('video-card') || card.querySelector('.video-thumbnail') || /^(mídia|midia|vídeo|video)$/i.test(type));
        if(!isVideo && !(link.matches('.timeline-button-horizontal') && /vídeo/i.test(link.textContent))) return;
        let url;
        try { url = new URL(link.href,win.location.href); } catch (_) { return; }
        if(url.protocol !== 'https:') return;
        let preview, provider;
        if(url.hostname === 'drive.google.com'){
          const id = url.pathname.match(/^\/file\/d\/([\w-]+)/)?.[1] || url.searchParams.get('id');
          if(!id || !/^[\w-]+$/.test(id)) return;
          preview = new URL('https://drive.google.com/file/d/' + id + '/preview');
          if(url.searchParams.has('resourcekey')) preview.searchParams.set('resourcekey',url.searchParams.get('resourcekey'));
          provider = 'Google Drive';
        } else if(url.hostname === 'youtu.be' || url.hostname === 'youtube.com' || url.hostname.endsWith('.youtube.com')){
          const id = url.hostname === 'youtu.be'
            ? url.pathname.split('/').filter(Boolean)[0]
            : (url.searchParams.get('v') || url.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]+)/)?.[1]);
          if(!id || !/^[\w-]{6,20}$/.test(id)) return;
          preview = new URL('https://www.youtube-nocookie.com/embed/' + id);
          preview.searchParams.set('autoplay','1');
          preview.searchParams.set('rel','0');
          provider = 'YouTube';
        } else return;
        event.preventDefault();event.stopImmediatePropagation();
        trigger = link;
        title.textContent = cardTitle(card)
          || link.closest('.timeline-item-horizontal')?.querySelector('.timeline-text-horizontal,h3')?.textContent
          || 'Vídeo da Biblioteca';
        const player = doc.createElement('iframe');
        player.title = title.textContent + ' — ' + provider;
        player.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
        player.allowFullscreen = true;
        player.src = preview.href;
        stage.replaceChildren(player);
        oldOverflow = doc.documentElement.style.overflow;
        resetSize();
        dialog.showModal();
        doc.documentElement.style.overflow = 'hidden';
      },true);
    }

    frame.addEventListener('load', async function(){
      let doc, win;
      try { doc = frame.contentDocument; win = frame.contentWindow; } catch (_) { return; }
      if (!doc || !win) return;
      document.title = doc.title || document.title;
      for (let i=0; i<40 && !injetar(doc); i++) await sleep(150);
      instalarSinopses(doc, win);
      instalarBibliotecario(doc, win);
      instalarPlayerBiblioteca(doc, win);
      // Reveal only after the initial uniform layout has been measured and placed.
      // One Tap / FedCM in the child needs a visible iframe; notify after reveal.
      frame.style.visibility = 'visible';
      try { win.postMessage({ type: 'rdc-parent', action: 'iframe-visible' }, win.location.origin); } catch (_) {}
      let normalizePending = false;
      const obs = new MutationObserver(records => {
        const relevant = records.some(record => {
          const target = record.target.nodeType === 1 ? record.target : record.target.parentElement;
          return target?.closest('.document-card,.timeline-item-horizontal') ||
            [...record.addedNodes].some(node => node.nodeType === 1 &&
              (node.matches('.document-card,.timeline-item-horizontal') || node.querySelector('.document-card,.timeline-item-horizontal')));
        });
        if (!relevant || normalizePending) return;
        normalizePending = true;
        win.requestAnimationFrame(() => { normalizePending = false; deduplicar(doc); });
      });
      try { obs.observe(doc.documentElement, {childList:true, subtree:true}); } catch (_) {}
      sincronizarFirebase(win).then(() => {
        setTimeout(() => { try { deduplicar(doc); } catch (_) {} }, 1200);
      });
    });
  })();
  </script>
