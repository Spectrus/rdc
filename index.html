    const frame = document.getElementById('site');
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function cardCode(card){
      const el = card && card.querySelector('.document-code');
      return el ? String(el.textContent || '').trim() : '';
    }
    function cardTitle(card){
      const el = card && card.querySelector('h3');
      return el ? String(el.textContent || '').trim() : '';
    }

    function corrigirGalo(doc){
      doc.querySelectorAll('.document-card').forEach(card => {
        if (cardTitle(card) === 'Galo de Briga – versão já OK' && cardCode(card) === '370') {
          const code = card.querySelector('.document-code');
          if (code) code.textContent = '350';
        }
      });
    }

    function criarCard(doc, item){
      const card = doc.createElement('div');
      card.className = 'document-card';
      card.dataset.publicacaoTemporaria = '20260905';

      const code = doc.createElement('div'); code.className = 'document-code'; code.textContent = item.code;
      const h3 = doc.createElement('h3'); h3.textContent = item.title;
      const autor = doc.createElement('div'); autor.className = 'document-author'; autor.textContent = item.author;
      const ano = doc.createElement('div'); ano.className = 'document-year'; ano.textContent = item.year;
      const p = doc.createElement('p'); p.textContent = item.description;
      const footer = doc.createElement('div'); footer.className = 'document-footer';
      const tipo = doc.createElement('span'); tipo.className = 'document-type'; tipo.textContent = item.type;
      const a = doc.createElement('a'); a.className = 'read-button'; a.href = item.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = item.button;
      footer.append(tipo, a);
      card.append(code, h3, autor, ano, p, footer);
      return card;
    }

    function deduplicar(doc){
      corrigirGalo(doc);
      itens.forEach(item => {
        const cards = Array.from(doc.querySelectorAll('.document-card')).filter(c => cardCode(c) === item.code);
        if (cards.length <= 1) return;
        let keeper = cards.find(c => !c.dataset.publicacaoTemporaria && cardTitle(c) === item.title)
                  || cards.find(c => cardTitle(c) === item.title)
                  || cards[0];
        cards.forEach(c => { if (c !== keeper) c.remove(); });
      });
    }

    function injetar(doc){
      corrigirGalo(doc);
      const grid = doc.getElementById('visible-documents');
      if (!grid) return false;
      itens.forEach(item => {
        const exact = Array.from(doc.querySelectorAll('.document-card')).some(c => cardCode(c) === item.code && cardTitle(c) === item.title);
        if (!exact) grid.prepend(criarCard(doc, item));
      });
      deduplicar(doc);
      return true;
    }

    async function sincronizarFirebase(win){
      for (let i=0; i<80; i++) {
        if (typeof win.firebaseLoadMemories === 'function' && typeof win.firebaseSaveMemory === 'function' && typeof win.firebaseUpdateByCode === 'function') break;
        await sleep(250);
      }
      if (typeof win.firebaseLoadMemories !== 'function' || typeof win.firebaseSaveMemory !== 'function') return;
      try { if (win.waitForFirebaseAuth) await win.waitForFirebaseAuth; } catch (_) {}
      let existentes = [];
      try { existentes = await win.firebaseLoadMemories(); } catch (_) { existentes = []; }
      const porCodigo = new Map(existentes.map(x => [String(x.code || ''), x]));
      for (const item of itens) {
        const fields = { title:item.title, author:item.author, year:item.year, type:item.type, description:item.description, sinopse:item.description, link:item.link };
        try {
          if (porCodigo.has(item.code)) {
            await win.firebaseUpdateByCode(Number(item.code), fields);
          } else {
            await win.firebaseSaveMemory({ ...fields, code:Number(item.code), avisarLista:false });
            porCodigo.set(item.code, true);
          }
        } catch (err) {
          console.error('[publicacoes 2026-09-05] falha no código', item.code, err);
        }
      }
    }

    // Explicit target heights keep animation independent of resize notifications.
    function instalarSinopses(doc, win){
      const acervo = doc.getElementById('acervo');
      if (!acervo) return;
      const style = doc.createElement('style');
      style.textContent = `
        #acervo:not(.view-list) .rdc-masonry {
          position:relative; overflow-anchor:none;
          transition:height 400ms cubic-bezier(.22,1,.36,1);
        }
        #acervo:not(.view-list) .rdc-masonry > .document-card {
          position:absolute; box-sizing:border-box; min-height:0;
          height:auto;
          animation:none !important; transform:none !important; opacity:1 !important;
          transition:top 400ms cubic-bezier(.22,1,.36,1),
            height 400ms cubic-bezier(.22,1,.36,1), box-shadow .2s ease;
        }
        #acervo:not(.view-list) .rdc-masonry > .document-card:not([data-rdc-ready]) { visibility:hidden; }
        #acervo:not(.view-list) .rdc-synopsis {
          flex:0 0 auto; box-sizing:content-box; min-height:0; overflow:hidden;
          transition:height 400ms cubic-bezier(.22,1,.36,1);
        }
        #acervo:not(.view-list) .rdc-masonry > .document-card h3 { margin:24px 0 8px; }
        #acervo:not(.view-list) .rdc-masonry > .document-card .document-year { margin:0 0 12px; }
        #acervo:not(.view-list) .rdc-masonry > .document-card .rdc-synopsis { margin:0 0 8px; }
        /* Preserve full-size media previews; the shared collapsed height includes them. */
        #acervo:not(.view-list) .rdc-masonry > .document-card :is(.video-thumbnail, .media-thumbnail-container) {
          flex-shrink:0;
        }
        #acervo .rdc-synopsis-toggle {
          align-self:flex-start; flex:0 0 auto; border:0; background:transparent;
          color:var(--primary-color, #4a2c2a); font:inherit; font-weight:600;
          text-decoration:underline; text-underline-offset:3px; cursor:pointer;
          padding:4px 0; margin:0 0 1rem; border-radius:4px;
        }
        #acervo .rdc-synopsis-toggle:focus-visible { outline:2px solid currentColor; outline-offset:4px; }
        #acervo .rdc-synopsis-toggle[data-unneeded] { visibility:hidden; pointer-events:none; }
        #acervo.view-list .rdc-synopsis-toggle { display:none; }
        #acervo.view-list .rdc-synopsis { height:auto !important; }
        #acervo .rdc-measuring, #acervo .rdc-measuring > .document-card,
        #acervo .rdc-measuring .rdc-synopsis { transition:none !important; }
        @media (prefers-reduced-motion:reduce) {
          #acervo .rdc-masonry, #acervo .rdc-masonry > .document-card,
          #acervo .rdc-synopsis { transition:none !important; }
        }
      `;
      doc.head.appendChild(style);
      const expanded = new Map();
      const entries = new WeakMap();
      const grids = new Map();
      let serial = 0, pending = 0;
      const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };
      const mutations = new win.MutationObserver(() => schedule());
      const observe = () => mutations.observe(acervo, {
        childList:true, subtree:true, characterData:true,
        attributes:true, attributeFilter:['class','style']
      });
      function schedule(){
        if (!pending) pending = win.requestAnimationFrame(rebuild);
      }
      // Only container WIDTH changes invalidate measurements. Animated heights do not.
      const resize = new win.ResizeObserver(records => {
        if (records.some(r => {
          const state = grids.get(r.target);
          return state && Math.abs(r.contentRect.width - state.width) > 0.5;
        })) schedule();
      });
      function keyFor(card){
        return card.dataset.cloudId || (cardCode(card) + ':' + cardTitle(card));
      }
      function prepare(card){
        const p = card.querySelector(':scope > p, :scope > .video-synopsis');
        if (!p) return null;
        let entry = entries.get(p);
        if (entry) return entry;
        const button = doc.createElement('button');
        button.type = 'button'; button.className = 'rdc-synopsis-toggle';
        if (!p.id) p.id = 'rdc-synopsis-' + (++serial);
        button.setAttribute('aria-controls', p.id);
        p.classList.add('rdc-synopsis'); p.after(button);
        entry = {p, button, key:keyFor(card), full:0, preview:0};
        entries.set(p, entry);
        button.addEventListener('click', event => {
          event.stopPropagation();
          if (button.hasAttribute('data-unneeded')) return;
          if (pending) { win.cancelAnimationFrame(pending); rebuild(); }
          expanded.set(entry.key, !expanded.get(entry.key));
          mutations.disconnect();
          const state = grids.get(card.parentElement);
          if (state) place(state);
          observe();
        });
        return entry;
      }
      function place(state){
        const heights = Array(state.columns).fill(0);
        state.cards.forEach((card, index) => {
          const entry = entries.get(card.querySelector('.rdc-synopsis'));
          const open = entry && expanded.get(entry.key);
          const spare = Math.max(0, state.baseHeight - state.collapsedHeights.get(card));
          const extra = open ? Math.max(0, entry.full - entry.preview - spare) : 0;
          const height = state.baseHeight + extra;
          const column = index % state.columns;
          if (entry) {
            set(entry.p, 'height', (open ? Math.max(entry.full, entry.preview) : entry.preview) + 'px');
            const label = open ? 'Ler menos' : 'Ler mais';
            if (entry.button.textContent !== label) entry.button.textContent = label;
            entry.button.setAttribute('aria-expanded', String(!!open));
          }
          set(card, 'height', height + 'px');
          set(card, 'left', (column * (state.cardWidth + state.gap)) + 'px');
          set(card, 'top', heights[column] + 'px');
          card.setAttribute('data-rdc-ready', 'true');
          heights[column] += height + state.rowGap;
        });
        set(state.grid, 'height', Math.max(0, ...heights.map(h => h - state.rowGap)) + 'px');
      }
      function rebuild(){
        pending = 0;
        mutations.disconnect();
        const list = acervo.classList.contains('view-list');
        for (const [grid] of grids) {
          if (!grid.isConnected) { resize.unobserve(grid); grids.delete(grid); }
        }
        acervo.querySelectorAll('.documents-grid').forEach(grid => {
          const all = Array.from(grid.children).filter(c => c.classList.contains('document-card'));
          if (list) {
            grid.classList.remove('rdc-masonry');
            set(grid, 'height', '');
            all.forEach(card => {
              ['height','width','top','left'].forEach(prop => set(card, prop, ''));
              const p = card.querySelector('.rdc-synopsis');
              if (p) set(p, 'height', '');
            });
            return;
          }
          if (!grid.clientWidth || win.getComputedStyle(grid).display === 'none') return;
          const css = win.getComputedStyle(grid);
          const columns = Math.max(1, css.gridTemplateColumns.split(' ').filter(Boolean).length);
          const gap = parseFloat(css.columnGap) || 0;
          const rowGap = parseFloat(css.rowGap) || gap;
          const width = grid.clientWidth;
          const cardWidth = (width - gap * (columns - 1)) / columns;
          const cards = all.filter(card => win.getComputedStyle(card).display !== 'none');
          const state = {grid, cards, width, columns, gap, rowGap, cardWidth, baseHeight:0, collapsedHeights:new Map()};
          if (!grids.has(grid)) resize.observe(grid);
          grids.set(grid, state);
          grid.classList.add('rdc-masonry', 'rdc-measuring');
          // Measure collapsed content once, before painting. All cards share its maximum.
          cards.forEach(card => {
            set(card, 'width', cardWidth + 'px'); set(card, 'height', 'auto');
            const entry = prepare(card);
            if (entry) {
              const {p, button} = entry;
              set(p, 'height', 'auto');
              const pc = win.getComputedStyle(p);
              const fontSize = parseFloat(pc.fontSize) || 16;
              if (pc.lineHeight === 'normal') set(p, 'lineHeight', '1.5');
              const line = parseFloat(win.getComputedStyle(p).lineHeight) || fontSize * 1.5;
              const padding = (parseFloat(pc.paddingTop) || 0) + (parseFloat(pc.paddingBottom) || 0);
              const border = (parseFloat(pc.borderTopWidth) || 0) + (parseFloat(pc.borderBottomWidth) || 0);
              entry.full = Math.ceil(p.getBoundingClientRect().height - padding - border);
              entry.preview = line * 3;
              button.toggleAttribute('data-unneeded', entry.full <= entry.preview + 1);
              button.tabIndex = button.hasAttribute('data-unneeded') ? -1 : 0;
              button.textContent = expanded.get(entry.key) ? 'Ler menos' : 'Ler mais';
              set(p, 'height', entry.preview + 'px');
            }
          });
          cards.forEach(card => {
            const naturalHeight = Math.ceil(card.getBoundingClientRect().height);
            state.collapsedHeights.set(card, naturalHeight);
            state.baseHeight = Math.max(state.baseHeight, naturalHeight);
          });
          place(state);
          void grid.offsetHeight;
          grid.classList.remove('rdc-measuring');
        });
        observe();
      }
      win.addEventListener('resize', schedule);
      acervo.addEventListener('load', event => { if (event.target.tagName === 'IMG') schedule(); }, true);
      doc.fonts.ready.then(schedule);
      rebuild();
    }

      function sync(){links().forEach(a=>{a.dataset.rdcLibrarian='';a.setAttribute('aria-controls',panel.id);a.setAttribute('aria-expanded',String(open));});}
      visual.addEventListener('load',()=>{

          #rdc-audio-controls{position:fixed;bottom:8px;left:12px;right:12px;display:flex;justify-content:center;gap:8px;z-index:999999}
          #rdc-audio-controls button{display:inline-flex!important;visibility:visible!important;align-items:center;border:1px solid #d4b45f;border-radius:20px;background:#f7f0e4;color:#4a2c2a;padding:7px 14px;font:14px Georgia;cursor:pointer}
          #rdc-audio-controls button:disabled{opacity:.4;cursor:default}
        `;
        child.head.append(s);
        const controls=child.createElement('div');controls.id='rdc-audio-controls';
        ['btnListen','btnStop'].forEach(id=>{const b=child.getElementById(id);if(b){b.hidden=false;b.removeAttribute('aria-hidden');controls.append(b);}});
        child.body.append(controls);
        visual.contentWindow.postMessage({type:'viz-dock',action:'resize'},win.location.origin);
      });
      function particles(){
        const out=[], box=visual.getBoundingClientRect();
        try{
          const sample=doc.createElement('canvas');sample.width=Math.ceil(box.width);sample.height=Math.ceil(box.height);
          const ctx=sample.getContext('2d');
          visual.contentDocument.querySelectorAll('canvas').forEach(c=>{
            const r=c.getBoundingClientRect();
            if(r.width&&r.height&&r.right>0&&r.left<box.width&&r.bottom>0&&r.top<box.height)ctx.drawImage(c,r.left,r.top,r.width,r.height);
          });
          const pixels=ctx.getImageData(0,0,sample.width,sample.height).data;
          for(let y=0;y<sample.height;y+=3)for(let x=0;x<sample.width;x+=3){
            const i=(y*sample.width+x)*4;
            if(pixels[i+3]>45 && (pixels[i]<225||pixels[i+1]<205||pixels[i+2]<185)){
              out.push({x:box.left+x,y:box.top+y,r:pixels[i],g:pixels[i+1],b:pixels[i+2],delay:Math.random()*.22,drift:(Math.random()-.5)*45,size:.5+Math.random()*1.1});
            }
          }
        }catch(error){console.warn('Bibliotecário: captura visual indisponível',error);}
        return out;
      }
      function shut(){
        if(!open)return;
        open=false;sync();const token=++generation;
        const dots=particles();
        try{visual.contentDocument.getElementById('btnStop')?.click();}catch(_){}
        panel.classList.add('rdc-dissolving');
        const finish=()=>{if(token!==generation)return;panel.hidden=true;vapor.hidden=true;visual.src='about:blank';panel.classList.remove('rdc-dissolving');};
        if(reduced()||!dots.length){win.setTimeout(finish,140);return;}
        vapor.width=win.innerWidth;vapor.height=win.innerHeight;vapor.hidden=false;
        const ctx=vapor.getContext('2d'),targetX=panel.getBoundingClientRect().right-40;
        const start=win.performance.now();
        function draw(now){
          if(token!==generation)return;
          const t=(now-start)/1150;ctx.clearRect(0,0,vapor.width,vapor.height);
          dots.forEach(p=>{
            const u=Math.max(0,Math.min(1,(t-p.delay)/(1-p.delay))),s=u*u;
            if(u>=1)return;
            ctx.fillStyle='rgba('+p.r+','+p.g+','+p.b+','+(1-u)+')';
            const x=p.x+(targetX-p.x)*s+Math.sin(u*7)*p.drift*(1-u);
            const y=p.y+(-60-p.y)*s-35*Math.sin(u*Math.PI);
            ctx.beginPath();ctx.arc(x,y,p.size*(1-.75*u),0,Math.PI*2);ctx.fill();
          });
          if(t<1)raf=win.requestAnimationFrame(draw);else finish();
        }
        raf=win.requestAnimationFrame(draw);
      }
      function show(){
        open=true;++generation;win.cancelAnimationFrame(raf);vapor.hidden=true;panel.classList.remove('rdc-dissolving');panel.hidden=false;
        if(visual.getAttribute('src')==='about:blank')visual.src='bibliotecario.html?embed=dock&corner=1';
        if(!reduced())panel.animate([{opacity:0,transform:'translateY(-18px) scale(.96)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'});
        sync();
      }
      doc.addEventListener('click',event=>{
        const a=event.target.closest('a');
        if(!a || !links().includes(a))return;
        event.preventDefault();event.stopImmediatePropagation();
        if(open)shut();else show();
      },true);
      close.addEventListener('click',()=>{shut();links().find(a=>a.getBoundingClientRect().width)?.focus();});
      doc.addEventListener('keydown',event=>{if(event.key==='Escape'&&open)shut();});
      sync();
    }

    frame.addEventListener('load', async function(){
      let doc, win;
      try { doc = frame.contentDocument; win = frame.contentWindow; } catch (_) { return; }
      if (!doc || !win) return;
      document.title = doc.title || document.title;
      for (let i=0; i<40 && !injetar(doc); i++) await sleep(150);
      instalarSinopses(doc, win);
      instalarBibliotecario(doc, win);
      // Reveal only after the initial uniform layout has been measured and placed.
      frame.style.visibility = 'visible';
      const obs = new MutationObserver(() => deduplicar(doc));
      try { obs.observe(doc.documentElement, {childList:true, subtree:true}); } catch (_) {}
      sincronizarFirebase(win).then(() => {
        setTimeout(() => { try { deduplicar(doc); } catch (_) {} }, 1200);
      });
    });
  })();
  </script>
